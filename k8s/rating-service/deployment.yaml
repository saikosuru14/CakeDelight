# rating-service - port 8083, owns rating_db (Requirements 11.3, 11.4, 11.5, 12.4).
#
# Configuration is injected wholly through envFrom: the JDBC URL from the ConfigMap,
# credentials from the Secret. Nothing is baked into the image (Requirement 11.5).
#
# Readiness resolves the readinessState + db group, so the pod only joins the Service
# endpoint list once Flyway has migrated rating_db and the pool is answering.
#
# Locally built image, no registry, so imagePullPolicy is IfNotPresent. Load it into the
# cluster first, e.g. `minikube image load cake-delight/rating-service:1.0.0`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: rating-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: cake-delight
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rating-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rating-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: cake-delight
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: rating-service
          image: cake-delight/rating-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: rating-service-config
            - secretRef:
                name: rating-service-credentials
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
