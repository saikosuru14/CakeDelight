# catalog-service non-secret configuration (Requirement 11.5).
# Everything here is safe to commit: hostnames and a JDBC URL, no credentials.
# The username and password come from catalog-service/secret.yaml instead.
#
# catalog-db is the Service created by k8s/postgres/catalog-db.yaml. The short name
# resolves inside the cake-delight namespace; the full form is
# catalog-db.cake-delight.svc.cluster.local:5432. Only catalog-service points here
# (Requirement 10.1).
#
# Variable names match the docker-compose environment block exactly, so the same image
# runs in both places with no rebuild (Requirement 11.5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: cake-delight
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog_db
