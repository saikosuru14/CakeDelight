# catalog-service - CPU-driven horizontal autoscaling
# (capstone brief section 7 "Deployment, scaling, and service discovery should be handled
# through Kubernetes", section 9 "scalability readiness").
#
# Safe to scale: the service is stateless. Cake data lives in catalog_db, not in the pod -
# no session state and no local disk, so replicas are interchangeable and the ClusterIP
# Service spreads requests across the ready endpoints. Browse and filter is the read-heavy
# path of the demo flow, which makes this the most useful service to scale out.
#
# Flyway runs on every pod start; the migrations are versioned and idempotent, so a second
# replica coming up against an already-migrated catalog_db is a no-op.
#
# Scaling on CPU utilization requires a CPU request on the pod, because utilization is
# measured as a percentage of the request. catalog-service/deployment.yaml declares
# requests.cpu: 200m, so averageUtilization 70 means roughly 140m of sustained CPU per pod
# before a scale-up.
#
# Requires metrics-server in the cluster. Without it the HPA reports <unknown> for CPU and
# never scales - see k8s/README.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-service
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: cake-delight
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-service
  minReplicas: 1
  # Modest ceiling on purpose: this is a single-node capstone demo cluster, not production.
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
