# catalog-service internal endpoint (Requirement 11.3).
# ClusterIP: reachable from the gateway and from order-service only, never from outside
# the cluster (Requirement 9.1). DNS for callers: catalog-service:8081
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: cake-delight
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalog-service
  ports:
    - name: http
      port: 8081
      targetPort: http
