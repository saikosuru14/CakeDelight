# PLACEHOLDER CREDENTIALS ONLY - these values are NOT real and must be replaced at deploy time.
# Replace them with a generated secret, e.g.:
#   kubectl -n cake-delight create secret generic notification-service-credentials \
#     --from-literal=SPRING_DATASOURCE_USERNAME=<user> \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=<password> \
#     --dry-run=client -o yaml | kubectl apply -f -
# Nothing in this repository may carry a real credential (Requirement 11.5).
#
# These must match the POSTGRES_USER / POSTGRES_PASSWORD in the notification-db-credentials
# Secret (k8s/postgres/secret.yaml) - same account, viewed from the client side.
# The broker runs PLAINTEXT with no authentication in this increment, so there is no
# Kafka credential to carry here.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-credentials
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: cake-delight
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: REPLACE_ME
  SPRING_DATASOURCE_PASSWORD: REPLACE_ME
