# notification-service - port 8084, owns notification_db, consumes order.completed
# (Requirements 11.3, 11.4, 11.5, 12.4).
#
# Configuration is injected wholly through envFrom: JDBC URL and Kafka bootstrap address
# from the ConfigMap, credentials from the Secret. Nothing is baked into the image
# (Requirement 11.5).
#
# Readiness resolves the readinessState + db group, so the pod only joins the Service
# endpoint list once Flyway has migrated notification_db. The Kafka consumer starts
# independently of the HTTP readiness state; if the broker is not up yet the listener
# retries its connection while the notification lookup API stays available.
#
# Locally built image, no registry, so imagePullPolicy is IfNotPresent. Load it into the
# cluster first, e.g. `minikube image load cake-delight/notification-service:1.0.0`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: cake-delight
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: cake-delight
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: notification-service
          image: cake-delight/notification-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-credentials
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
