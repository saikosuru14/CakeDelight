# PLACEHOLDER CREDENTIALS ONLY - these values are NOT real and must be replaced at deploy time.
# Replace them with a generated secret, e.g.:
#   kubectl -n cake-delight create secret generic catalog-db-credentials \
#     --from-literal=POSTGRES_USER=<user> --from-literal=POSTGRES_PASSWORD=<password> \
#     --dry-run=client -o yaml | kubectl apply -f -
# Nothing in this repository may carry a real credential (Requirement 11.5).
#
# One Secret per database keeps the database-per-service boundary intact: a service's
# Secret only ever grants access to the database that service owns (Requirement 10.1).
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-credentials
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: catalog-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cake-delight
type: Opaque
stringData:
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
