# order-service - port 8082, owns order_db, publishes order.completed
# (Requirements 11.3, 11.4, 11.5, 12.4).
#
# Configuration is injected wholly through envFrom: JDBC URL, Kafka bootstrap address and
# the catalog URL from the ConfigMap, credentials from the Secret. Nothing is baked into
# the image (Requirement 11.5).
#
# Readiness resolves the readinessState + db group, so the pod only joins the Service
# endpoint list once Flyway has migrated order_db. Kafka is deliberately NOT part of the
# readiness group: a broker outage degrades event publishing (logged at ERROR) but must not
# take the checkout API out of rotation (Requirement 6.4).
#
# Locally built image, no registry, so imagePullPolicy is IfNotPresent. Load it into the
# cluster first, e.g. `minikube image load cake-delight/order-service:1.0.0`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: cake-delight
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: cake-delight
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: order-service
          image: cake-delight/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-credentials
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
