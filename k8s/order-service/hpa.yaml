# order-service - CPU-driven horizontal autoscaling
# (capstone brief section 7 "Deployment, scaling, and service discovery should be handled
# through Kubernetes", section 9 "scalability readiness").
#
# Safe to scale: the service is stateless. Baskets and orders live in order_db, not in pod
# memory, so a customer's basket is visible to whichever replica handles the next request -
# there is no sticky session requirement. No local disk either.
#
# Kafka side: order-service is a *producer* on order.completed. Producers are not
# partition-bound the way consumers are, so extra replicas all publish freely; the message
# key is the order id, which keeps per-order ordering intact no matter which replica sends.
#
# Scaling on CPU utilization requires a CPU request on the pod, because utilization is
# measured as a percentage of the request. order-service/deployment.yaml declares
# requests.cpu: 200m, so averageUtilization 70 means roughly 140m of sustained CPU per pod
# before a scale-up.
#
# Requires metrics-server in the cluster. Without it the HPA reports <unknown> for CPU and
# never scales - see k8s/README.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: cake-delight
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 1
  # Modest ceiling on purpose: this is a single-node capstone demo cluster, not production.
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
