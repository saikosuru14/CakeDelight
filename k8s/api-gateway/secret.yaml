# INTENTIONALLY EMPTY - the api-gateway has no secret configuration in this increment.
#
# The gateway holds no database and no broker connection, and authentication is out of
# scope for this increment, so it reads no credential of any kind. Every value it needs is
# a plain in-cluster Service address and lives in api-gateway/configmap.yaml.
#
# This file exists so the gateway matches the four services structurally: one
# deployment.yaml, service.yaml, configmap.yaml, and secret.yaml per component, and the
# Deployment's `envFrom` secretRef resolves instead of leaving the pod stuck on a missing
# Secret. An empty Secret contributes no environment variables.
#
# When a real credential arrives (an API key, a TLS keystore password), add it here as a
# REPLACE_ME placeholder following the same convention as the service Secrets. Nothing in
# this repository may carry a real credential (Requirement 11.5).
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-credentials
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: cake-delight
type: Opaque
# No `stringData` / `data` block on purpose: there is nothing to put in it yet.
