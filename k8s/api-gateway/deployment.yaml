# api-gateway - port 8080, the single client entry point
# (Requirements 9.1, 11.3, 11.4, 11.5, 12.4).
#
# Reactive Spring Cloud Gateway: route table only, no database and no broker. Downstream
# URLs are injected through envFrom from the ConfigMap; nothing is baked into the image
# (Requirement 11.5). The Secret reference is present for structural symmetry with the four
# services and is intentionally empty - see secret.yaml.
#
# Probes use the state-only groups from application.yml: liveness = livenessState,
# readiness = readinessState. There is no db contributor here, so the gateway becomes ready
# as soon as the reactive server is accepting connections. It does not wait on the
# downstream services either; an unreachable downstream surfaces per request as a 503
# naming the service (Requirement 9.4) rather than as an unready gateway.
#
# Locally built image, no registry, so imagePullPolicy is IfNotPresent. Load it into the
# cluster first, e.g. `minikube image load cake-delight/api-gateway:1.0.0`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: cake-delight
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: cake-delight
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: api-gateway
          image: cake-delight/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: api-gateway-credentials
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
