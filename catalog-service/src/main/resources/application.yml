spring:
  application:
    name: catalog-service

  # All connection details come from the environment. No credentials live in this file.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate never alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # health,info for probes and build identity; metrics,prometheus for basic monitoring.
        # `prometheus` is contributed by micrometer-registry-prometheus and serves the scrape
        # payload at /actuator/prometheus. No Prometheus server or dashboard stack is deployed -
        # the endpoint is exposed so a scraper can be pointed at it.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},requestId=%X{requestId:-}]"
  level:
    root: INFO
    com.cakedelight.catalog: INFO
