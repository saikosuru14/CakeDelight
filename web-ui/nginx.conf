# Cake Delight - Web UI server block.
#
# Copied to /etc/nginx/conf.d/default.conf, so the stock nginx.conf still supplies the
# `events` and `http` blocks.
#
# This file is the reason there is no CORS configuration anywhere in the project: nginx
# serves the static client AND reverse-proxies /api/ to the API Gateway, so the browser
# only ever talks to one origin (http://localhost:8090). No preflight, no
# Access-Control-* headers, nothing to keep in sync on the gateway.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Resolving through it at request time, rather than once at
    # startup, means a gateway container restart on a new IP does not need an nginx reload.
    resolver 127.0.0.11 ipv6=off valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    # Static client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything the client calls lives under /api/ and is forwarded unchanged: the gateway
    # applies no StripPrefix, so the path a service sees is the path the browser sent.
    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough to cover the gateway retry budget plus the order-service to
        # catalog-service retry budget underneath it.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
